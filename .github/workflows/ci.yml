name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The model tier is never exercised in CI. It is an optional adapter behind an
  # interface, and its contract is covered by tests with a fake client, so CI
  # needs no API key and no network.
  SETTLE_CI: "1"

jobs:
  lint:
    name: ruff + mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev,api,bench,model]"
      - run: uv pip install -e "./app[dev,model]"
      - name: ruff check
        run: .venv/bin/ruff check src tests bench app
      - name: ruff format
        run: .venv/bin/ruff format --check src tests bench app
      - name: mypy strict
        run: .venv/bin/mypy

  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install -e ".[dev,api,bench,model]"
      - run: uv pip install -e "./app[dev,model]"
      - name: pytest with the deep Hypothesis profile
        run: >
          .venv/bin/pytest
          --hypothesis-profile=thorough
          --cov=settle
          --cov=settle_app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  benchmark:
    name: benchmark smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev,api,bench]"
      - name: committed results must reproduce
        # The numbers in the README are generated, not typed. If a change moves
        # them, the commit has to move them too. The full benchmark runs in
        # about ten seconds, so there is no reason to check a reduced version.
        run: .venv/bin/python -m bench.check

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: settle:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the engine image runs
        run: |
          docker run --rm settle:ci version
          docker run --rm settle:ci --help

      - name: build the app image
        uses: docker/build-push-action@v6
        with:
          # The repository root: settle-app depends on settle-engine by path,
          # so both trees have to be in the build context.
          context: .
          file: app/Dockerfile
          push: false
          load: true
          tags: settle-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the app image runs and carries its templates
        run: |
          docker run --rm settle-app:ci version
          docker run --rm --entrypoint python settle-app:ci -c \
            "import pathlib, settle_app; d = pathlib.Path(settle_app.__file__).parent; \
             assert (d / 'templates' / 'run.html').is_file(); \
             assert (d / 'static' / 'app.css').is_file(); \
             assert (d / 'samples' / 'invoices.csv').is_file(); \
             print('package data present')"

      - name: the app serves
        run: |
          docker run -d --name probe -p 8000:8000 \
            -e SETTLE_WEB_PASSWORD=a-long-enough-ci-password settle-app:ci
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          docker rm -f probe

      - name: the compose file is valid
        # Catches a typo here rather than on the box, mid-deploy.
        run: SETTLE_DOMAIN=example.invalid docker compose -f app/docker-compose.yml config -q
