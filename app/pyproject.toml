[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "settle-app"
version = "0.1.0"
description = "A browser interface for the settle reconciliation engine: upload two files, get answers, keep the history."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Tamas Nagy", email = "nagytmas@gmail.com" }]
keywords = ["reconciliation", "invoice", "payments", "finance", "web"]

# The engine is a dependency, never a sibling import. Everything this package
# knows about matching, money and serialisation comes through settle's public
# surface, which is what keeps the two distributions genuinely separable.
dependencies = [
    "settle-engine>=0.1.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    # Used directly by settle_app.cli. It arrives transitively via the engine
    # too, but depending on it implicitly would break the day the engine
    # changed its CLI framework.
    "typer>=0.12",
    # Required for UploadFile and Form. FastAPI raises at route-registration
    # time without it, so a missing install fails loudly rather than at the
    # first upload.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The column mapper's model tier. Off by default; the app is complete without it.
model = ["anthropic>=0.34"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
settle-app = "settle_app.cli:app"

[project.urls]
Repository = "https://github.com/nagytamasgit/settle"

# settle-engine is not on PyPI. For local development and the Docker build, uv
# resolves it from the repository root rather than the index.
[tool.uv.sources]
settle-engine = { path = "..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/settle_app"]
